# NuN Interface Registry — machine-readable twin of the README matrix.
# Public-safe: no secrets, hostnames, IPs, device serials, or private paths.
registry:
  authority: "bis3946"
  network: "Nexus of Unity (NuN)"
  protocol_version: "1.1.0"
  schema_version: "interfaces-1.1.0"
  envelope_schema: "interfaces/envelope.schema.json"
  actors:
    H: "Human"
    A: "Agent"
    M: "Machine"
    S: "System"
gates:
  human_consent: "Human consent"
  root_authority_gate: "Root authority gate"
  mutual_consent: "Mutual consent"
  peer_attestation: "Peer attestation"
  policy_check: "Policy check"
interfaces:
  - id: "A2A"
    from: "A"
    to: "A"
    purpose: "Agent fleet handoff, shared skills, mesh cognition"
    status: "live"
    gate: "peer_attestation"
    message_types: ["hello", "ack", "nack", "handoff", "query", "response", "event", "heartbeat"]
    detail: "interfaces/a2a.md"
  - id: "A2H"
    from: "A"
    to: "H"
    purpose: "Agents reporting and surfacing results to humans"
    status: "live"
    gate: "human_consent"
    message_types: ["hello", "ack", "report", "alert", "consent_request", "response"]
    detail: "interfaces/a2h.md"
  - id: "A2M"
    from: "A"
    to: "M"
    purpose: "Agents commanding and reading machines"
    status: "live"
    gate: "root_authority_gate"
    message_types: ["hello", "ack", "nack", "command", "query", "response", "heartbeat"]
    detail: "interfaces/a2m.md"
  - id: "A2S"
    from: "A"
    to: "S"
    purpose: "Agents calling system APIs and registries"
    status: "live"
    gate: "policy_check"
    message_types: ["hello", "ack", "nack", "query", "response", "event", "report"]
    detail: "interfaces/a2s.md"
  - id: "H2A"
    from: "H"
    to: "A"
    purpose: "Root and authorized humans directing agents"
    status: "live"
    gate: "human_consent"
    message_types: ["hello", "ack", "nack", "command", "query", "consent_grant", "consent_revoke"]
    detail: "interfaces/h2a.md"
  - id: "H2H"
    from: "H"
    to: "H"
    purpose: "Human collaboration protocols (public-safe)"
    status: "live"
    gate: "mutual_consent"
    message_types: ["hello", "ack", "query", "response", "report", "consent_request", "consent_grant", "consent_revoke"]
    detail: "interfaces/h2h.md"
  - id: "H2M"
    from: "H"
    to: "M"
    purpose: "Humans operating machines through local UI or Command Center"
    status: "live"
    gate: "human_consent"
    message_types: ["hello", "ack", "nack", "command", "query", "response"]
    detail: "interfaces/h2m.md"
  - id: "H2S"
    from: "H"
    to: "S"
    purpose: "Humans operating systems through Command Center and dashboards"
    status: "live"
    gate: "human_consent"
    message_types: ["hello", "ack", "nack", "command", "query", "config", "consent_grant", "consent_revoke"]
    detail: "interfaces/h2s.md"
  - id: "M2A"
    from: "M"
    to: "A"
    purpose: "Machines feeding telemetry and events to agents"
    status: "live"
    gate: "peer_attestation"
    message_types: ["hello", "ack", "telemetry", "event", "alert", "heartbeat"]
    detail: "interfaces/m2a.md"
  - id: "M2H"
    from: "M"
    to: "H"
    purpose: "Machine alerts and telemetry to humans"
    status: "live"
    gate: "human_consent"
    message_types: ["hello", "ack", "alert", "telemetry", "report"]
    detail: "interfaces/m2h.md"
  - id: "M2M"
    from: "M"
    to: "M"
    purpose: "Device-to-device telemetry, PoA validation, optical/LiGi links"
    status: "live"
    gate: "peer_attestation"
    message_types: ["hello", "ack", "nack", "telemetry", "heartbeat", "proof", "event"]
    detail: "interfaces/m2m.md"
  - id: "M2S"
    from: "M"
    to: "S"
    purpose: "Machines reporting into systems"
    status: "live"
    gate: "peer_attestation"
    message_types: ["hello", "ack", "nack", "telemetry", "event", "heartbeat", "report"]
    detail: "interfaces/m2s.md"
  - id: "S2A"
    from: "S"
    to: "A"
    purpose: "Systems dispatching and constraining agents"
    status: "live"
    gate: "root_authority_gate"
    message_types: ["hello", "ack", "command", "config", "event", "response"]
    detail: "interfaces/s2a.md"
  - id: "S2H"
    from: "S"
    to: "H"
    purpose: "System status and proofs to humans"
    status: "live"
    gate: "human_consent"
    message_types: ["hello", "ack", "report", "alert", "proof", "consent_request"]
    detail: "interfaces/s2h.md"
  - id: "S2M"
    from: "S"
    to: "M"
    purpose: "Systems configuring and governing machines"
    status: "live"
    gate: "root_authority_gate"
    message_types: ["hello", "ack", "nack", "config", "command", "query", "response"]
    detail: "interfaces/s2m.md"
  - id: "S2S"
    from: "S"
    to: "S"
    purpose: "Service-to-service mesh contracts"
    status: "live"
    gate: "peer_attestation"
    message_types: ["hello", "ack", "nack", "query", "response", "event", "heartbeat"]
    detail: "interfaces/s2s.md"
