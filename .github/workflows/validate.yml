name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate interfaces (stdlib only)
        run: python tools/validate_interfaces.py
      - name: Reference implementation demo
        run: python tools/nun_interface.py demo
      - name: Unit tests (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Cross-check with jsonschema + PyYAML
        run: |
          python -m pip install --disable-pip-version-check "jsonschema>=4.18,<5" "PyYAML>=6,<7"
          python tools/validate_interfaces.py
